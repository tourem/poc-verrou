server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: shedlock-poc
  datasource:
    # H2 en mode TCP server (pas en mode fichier)
    # Le serveur H2 doit etre demarre AVANT les instances (voir README)
    url: jdbc:h2:tcp://localhost:9092/~/shedlock-poc
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

# --- Configuration du POC ---
batch:
  # Duree simulee d'execution du batch (en minutes)
  simulated-duration-minutes: ${BATCH_DURATION_MINUTES:20}

# --- Logging ---
logging:
  level:
    root: INFO
    com.poc.shedlock: DEBUG
    net.javacrumbs.shedlock: INFO

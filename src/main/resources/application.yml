server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: shedlock-poc
  datasource:
    url: jdbc:h2:file:./data/shedlock-poc;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

# --- Configuration du POC ---
batch:
  # Durée simulée d'exécution du batch (en minutes)
  # Passez une valeur > 10 pour tester KeepAliveLockProvider
  # Exemple : 20 = le batch "tourne" pendant 20 min, le verrou est renouvelé automatiquement
  simulated-duration-minutes: ${BATCH_DURATION_MINUTES:20}

# --- Logging ---
logging:
  level:
    root: INFO
    com.poc.shedlock: DEBUG
    net.javacrumbs.shedlock: DEBUG
